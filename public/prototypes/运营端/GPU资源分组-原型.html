<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务器资源分组 · OneLink AI</title>
<link rel="icon" href="云电脑实例/assets/website-logo.svg">
<style>
:root{
  --bg:#F0F2F5; --surface:#FFFFFF; --surface-2:#F5F6F8; --line:#E6E8EC; --line-2:#D4D8DF;
  --fg:#1D2129; --fg-2:#565E6C; --fg-3:#8A919E;
  --primary:#2B66E8; --primary-soft:#E9F0FE;
  --course:#5B4FD6; --course-soft:#ECEAFB; --payg:#D0730E; --payg-soft:#FCEEDD;
  --ok:#1F9A57; --ok-soft:#E3F5EA; --warn:#B57200; --warn-soft:#FFF3D6; --err:#DC4135; --err-soft:#FDEAE8;
  --mask:rgba(16,20,28,.42); --shadow:0 12px 40px rgba(20,28,45,.16);
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1218; --surface:#181C24; --surface-2:#1F242E; --line:#2A303B; --line-2:#363D4A;
  --fg:#E5E8EE; --fg-2:#A6AEBD; --fg-3:#737C8D;
  --primary:#5B8EF3; --primary-soft:#1D2A44;
  --course:#8F86F2; --course-soft:#272447; --payg:#EE9D3E; --payg-soft:#3A2915;
  --ok:#3DC27C; --ok-soft:#163224; --warn:#E3A93C; --warn-soft:#382C12; --err:#F06A5F; --err-soft:#3C1E1C;
  --mask:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#181C24; --surface-2:#1F242E; --line:#2A303B; --line-2:#363D4A;
  --fg:#E5E8EE; --fg-2:#A6AEBD; --fg-3:#737C8D;
  --primary:#5B8EF3; --primary-soft:#1D2A44;
  --course:#8F86F2; --course-soft:#272447; --payg:#EE9D3E; --payg-soft:#3A2915;
  --ok:#3DC27C; --ok-soft:#163224; --warn:#E3A93C; --warn-soft:#382C12; --err:#F06A5F; --err-soft:#3C1E1C;
  --mask:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.mono{font-family:var(--mono);font-size:12px}

.strip{max-width:1680px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.strip h1{font-size:15px;margin:0;font-weight:600}
.strip h1 small{font-weight:400;color:var(--fg-3);margin-left:8px;font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:6px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}

.app{max-width:1680px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hd{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500}
.wrap{display:flex;min-height:780px}
.nav{width:212px;flex:none;border-right:1px solid var(--line);padding:10px 0;font-size:14px}
.nav .g{padding:9px 20px;display:flex;justify-content:space-between;color:var(--fg)}
.nav .g.on{color:var(--primary)}
.nav .s{padding:8px 20px 8px 44px;color:var(--fg-2);display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left}
.nav a.s{text-decoration:none}
.nav .s svg{width:14px;height:14px;flex:none}
.nav .s.on{color:var(--primary);background:var(--primary-soft)}
.nav .s.link:hover{color:var(--primary)}
.main{flex:1;min-width:0;background:var(--bg);padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
.crumb{font-size:13px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--fg-3)}
.crumb button:hover{color:var(--primary)}
.crumb b{color:var(--fg);font-weight:500}
.panel{background:var(--surface);border-radius:8px;padding:18px 20px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.ph h2{font-size:16px;margin:0;font-weight:600}
.ph p{margin:3px 0 0;color:var(--fg-3);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px}
.filters label{display:block;font-size:13px;margin-bottom:6px;font-weight:500}
.fake,.filters select{width:100%;height:36px;border-radius:6px;background:var(--surface-2);border:1px solid transparent;padding:0 12px;display:flex;align-items:center;color:var(--fg-3);font-size:13px}
.filters select{color:var(--fg);font:inherit;font-size:13px}
.frow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{border-style:dashed;color:var(--fg-2)}
.btn.sm{padding:3px 10px;font-size:12px}
.link{border:0;background:none;color:var(--primary);padding:0;font-size:13px;white-space:nowrap}
.link.danger{color:var(--err)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;line-height:20px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.course{background:var(--course-soft);color:var(--course)}
.tag.payg{background:var(--payg-soft);color:var(--payg)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.gray{background:var(--surface-2);color:var(--fg-2)}
.lbl{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;color:var(--fg)}
.pools-sum{display:grid;gap:6px;margin-top:6px}
.pool-gpu-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;font-size:12px}
.pool-gpu-row .tag{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pool-gpu-total{color:var(--fg-2);white-space:nowrap}
.pool-gpu-idle{color:var(--ok);white-space:nowrap;min-width:68px;text-align:right}
.room-gpus{min-width:310px}
.gpu-model{padding:8px 0}
.gpu-model+.gpu-model,.room-gpus details{border-top:1px solid var(--line)}
.gpu-model-name{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.gpu-model-name strong{font-weight:600}
.gpu-model-name span{white-space:nowrap}
.room-gpus summary{cursor:pointer;color:var(--primary);padding-top:8px}
.room-gpus details[open] .gpu-expand,.room-gpus details:not([open]) .gpu-collapse{display:none}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--fg-2);background:var(--surface-2);padding:10px 12px;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
.ops{display:flex;gap:14px;flex-wrap:nowrap}
.srvinfo b{font-weight:500}
.srvinfo div{overflow-wrap:anywhere;color:var(--fg-3);font-size:12.5px;line-height:1.6}
.hw{font-size:12.5px;line-height:1.65;min-width:162px}
.use{min-width:105px;font-size:12.5px}
.use .r{display:flex;justify-content:space-between}
.use .b{height:3px;border-radius:2px;background:var(--line);margin:3px 0 8px}
.use .b i{display:block;height:100%;border-radius:2px;background:var(--ok)}
.use .b i.hi{background:var(--err)}
.pbar{width:140px;height:6px;border-radius:3px;background:var(--line)}
.pbar i{display:block;height:100%;width:2%;background:var(--primary);border-radius:3px}

.stags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mask{position:fixed;inset:0;background:var(--mask);z-index:20;display:flex;justify-content:center;align-items:center;padding:16px}
.modal{width:min(760px,100%);max-height:100%;background:var(--surface);box-shadow:var(--shadow);border-radius:10px;display:flex;flex-direction:column}
#adjDialog{width:min(460px,calc(100% - 32px));max-height:calc(100% - 32px);padding:0;border:0;background:var(--surface);color:var(--fg);border-radius:10px;box-shadow:var(--shadow)}
#adjDialog::backdrop{background:var(--mask)}
.edit-dialog{width:min(500px,calc(100% - 32px));max-height:calc(100% - 32px);padding:0;border:0;background:var(--surface);color:var(--fg);border-radius:10px;box-shadow:var(--shadow)}
.edit-dialog::backdrop{background:var(--mask)}
.edit-dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
#nodesDialog{width:min(850px,calc(100% - 32px))}
.form-field{display:grid;gap:9px}
.field-input{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit}
.choices{display:flex;gap:12px 20px;flex-wrap:wrap}
.choices label,.select-all{display:flex;align-items:center;gap:7px;cursor:pointer}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;flex:none}
.form-error{color:var(--err);font-size:13px;margin:0}
.node-tools{display:flex;gap:12px;align-items:center;justify-content:space-between}
.node-tools .field-input{max-width:360px}
.group-billings{display:flex;gap:6px;flex-wrap:wrap}
.group-overview{display:flex;gap:24px;flex-wrap:wrap;color:var(--fg-2);margin-top:12px}
.group-overview b{font-size:20px;color:var(--fg);margin-right:5px}
.node-choice-row:has(input:checked){background:var(--primary-soft)}
.group-current{margin:0;color:var(--fg-2)}
.group-form{display:grid;gap:8px}
.group-form select{width:100%;min-height:38px;padding:6px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit}
.group-status{margin:0;padding:10px 12px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);font-size:13px}
.group-status[data-tone="warn"]{background:var(--warn-soft);color:var(--warn)}
.group-status[data-tone="error"]{background:var(--err-soft);color:var(--err)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);gap:12px}
.dh h3{margin:0;font-size:16px;font-weight:600}
.dh h3 span{font-weight:400;color:var(--fg-3);font-size:13px;margin-left:8px}
.x{border:0;background:none;font-size:20px;color:var(--fg-3);line-height:1;padding:4px 6px}
.db{flex:1;overflow-y:auto;padding:18px 22px 24px;display:flex;flex-direction:column;gap:22px}
.df{border-top:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--fg-2);line-height:1.7;margin:0}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 0;font-size:14px;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 28px;background:var(--surface-2);border-radius:8px;padding:16px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv div span:first-child{color:var(--fg-3)}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.server-filters{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:760px){.server-filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.server-filters{grid-template-columns:minmax(0,1fr)}}
.server-ops{display:flex;flex-wrap:nowrap;gap:14px;align-items:flex-start;min-width:176px}
.server-ops button:disabled,.server-group button:disabled{opacity:.5;cursor:not-allowed}
.resource-group-cell{min-width:190px;width:212px}
.resource-group{max-width:212px}
.resource-group-content{min-width:0;flex:1}
.resource-group-name{display:block;max-width:212px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;line-height:22px;color:var(--fg)}
.resource-group-room{display:block;color:var(--fg-3);font-size:12px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resource-group.unassigned .resource-group-name{color:var(--fg-3);font-weight:400}
.resource-group-sync{font-size:12px;line-height:20px;color:var(--fg-3)}
.resource-group-sync.failed{color:var(--err)}
.group-identity{min-width:180px;max-width:260px}
.group-identity strong{display:block;font-weight:600;overflow-wrap:anywhere}
.server-group{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.filters input::placeholder{color:var(--fg-3)}
@media (max-width:960px){.nav{display:none}.main{padding:12px}}
@media (max-width:560px){.db,.dh,.df{padding-left:16px;padding-right:16px}}
</style>

</head>
<body>
<div class="strip">
  <h1>运营端原型<small>资源分组 · 演示数据</small></h1>
  <div class="seg" role="group" aria-label="视图" id="tabs">
    <button data-v="rooms">机房管理</button>
    <button data-v="servers">服务器管理</button>
    <button data-v="groups">资源分组</button>
  </div>
</div>

<div class="app" id="app">
  <header class="hd"><div class="logo"><img src="云电脑实例/assets/website-logo.svg" width="135" alt="OneLink AI"></div><div>运营人员</div></header>
  <div class="wrap">
    <nav class="nav" aria-label="主导航">
      <div class="g">数据概览</div>
      <div class="g">厂商管理<span class="muted">⌄</span></div>
      <div class="g">供应商管理<span class="muted">⌄</span></div>
      <div class="g">模型管理<span class="muted">⌄</span></div>
      <div class="g">商品管理<span class="muted">⌄</span></div>
      <div class="g on">云电脑管理<span>⌃</span></div>
      <div id="subnav"></div>
      <div class="g">用户管理<span class="muted">⌄</span></div>
      <div class="g">代理商管理<span class="muted">⌄</span></div>
      <a class="s link" href="OneLink运营后台-原型.html#tenant-list">返回运营后台原型</a>
    </nav>
    <main class="main" id="main"></main>
  </div>
</div>

<dialog id="adjDialog" aria-labelledby="adjTitle">
  <form id="adjForm">
    <div class="dh"><h3 id="adjTitle">设置分组</h3></div>
    <div class="db">
      <p class="group-current" id="groupCurrent"></p>
      <div class="group-form">
        <label for="groupTarget">目标分组</label>
        <select id="groupTarget" aria-describedby="groupStatus" autofocus>
          <option value="" disabled>请选择分组</option>
        </select>
        <p class="hint">适用购买方式 <strong id="groupPurchase">—</strong></p>
      </div>
      <p class="group-status" id="groupStatus" role="status" hidden></p>
    </div>
    <div class="df">
      <button class="btn" type="button" id="adjClose">关闭</button>
      <button class="btn primary" type="submit" id="adjOk">保存</button>
    </div>
  </form>
</dialog>

<dialog id="createDialog" class="edit-dialog" aria-labelledby="createTitle">
  <form id="createForm" novalidate>
    <div class="dh"><h3 id="createTitle">创建资源分组</h3><button type="button" class="x" data-dialog-close="createDialog" aria-label="关闭">×</button></div>
    <div class="db">
      <div class="form-field"><label for="newGroupRoom">所属机房 <span style="color:var(--err)">*</span></label>
        <select id="newGroupRoom" class="field-input" required><option value="">请选择机房</option></select></div>
      <div class="form-field"><label for="newGroupName">分组名称 <span style="color:var(--err)">*</span></label>
        <input id="newGroupName" class="field-input" placeholder="请输入分组名称" minlength="2" maxlength="128" autocomplete="off" aria-describedby="groupNameHint" required>
        <p class="hint" id="groupNameHint">2–128 个字符，支持中文、英文字母、数字和连字符（-）；须以中文或英文字母开头，不能以连字符结尾。中文名称由后端按拼音或拼音首字母转换。</p></div>
      <div class="form-field"><span id="billingLabel">关联付费方式 <span style="color:var(--err)">*</span></span>
        <div class="choices" id="billingChoices" role="group" aria-labelledby="billingLabel"></div>
        <p class="hint" id="billingAvailability" role="status" hidden></p>
      </div>
      <p id="createError" class="form-error" role="alert" hidden></p>
    </div>
    <div class="df"><button type="button" class="btn" data-dialog-close="createDialog">取消</button><button type="submit" class="btn primary">创建分组</button></div>
  </form>
</dialog>

<dialog id="nodesDialog" class="edit-dialog" aria-labelledby="nodesTitle">
  <form id="nodesForm">
    <div class="dh"><h3 id="nodesTitle">添加服务器节点</h3><button type="button" class="x" data-dialog-close="nodesDialog" aria-label="关闭">×</button></div>
    <div class="db" style="gap:14px">
      <p class="group-current" id="nodeGroupName"></p>
      <div class="node-tools"><input class="field-input" id="nodeSearch" type="search" aria-label="搜索可添加服务器" placeholder="搜索服务器名称、ID"><span class="muted num" id="nodeCount"></span></div>
      <p class="hint">仅显示当前机房内未归组的服务器，允许添加已有实例或 GPU 正在使用的服务器。分组仅影响后续新建 VM。</p>
      <div class="tbl-wrap" id="nodeCandidates"></div>
      <p id="nodesError" class="form-error" role="alert" hidden></p>
    </div>
    <div class="df"><span class="muted num" id="nodeSelectedCount" style="margin-right:auto"></span><button type="button" class="btn" data-dialog-close="nodesDialog">取消</button><button type="submit" class="btn primary" id="nodesOk" disabled>确认添加</button></div>
  </form>
</dialog>

<div class="mask center" id="srvMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="srvTitle">
    <div class="dh"><h3 id="srvTitle">服务器详情</h3><button class="x" data-close="srvMask" aria-label="关闭">×</button></div>
    <div class="tabs" role="tablist" id="srvTabs"></div>
    <div class="db" id="srvBody"></div>
    <div class="df"><button class="btn" data-close="srvMask">关闭</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const BILLING = {course:'按课表付费',timer:'计时付费',period:'包周期付费'};
const ROOMS = [
  {id:'2',name:'鲍山机房-高可用',code:'002',city:'济南市',address:'山东省 济南市 历城区 鲍山街道',note:'烈士山东路1号济南联通鲍山…',servers:12,cpu:'1472核心',memory:'11.19T内存',storage:1.92},
  {id:'demo-b',name:'演示机房B',code:'DEMO-B',city:'演示城市',address:'演示机房地址',note:'用于验证跨机房分组隔离',servers:1,cpu:'128核心',memory:'1007.52G内存',storage:0}
];
const roomName=id=>ROOMS.find(room=>room.id===id)?.name??'—';
const roomOptions=(allLabel='全部机房')=>`<option value="${allLabel==='请选择机房'?'':'all'}">${allLabel}</option>`+ROOMS.map(room=>`<option value="${room.id}">${esc(room.name)}</option>`).join('');

const STATE = {active:'已生效', syncing:'同步中', failed:'同步失败'};
const srvCards=si=>cards.filter(c=>c.s===si);
const srvRun=si=>srvCards(si).filter(c=>c.st==='busy').length+SERVERS[si].cpuOnlyRunning;
const srvBound=si=>srvRun(si)+SERVERS[si].retainedBindings;
const srvOk=s=>s.state==='active';
function gpuModels(devices){
  const models=new Map();
  for(const card of devices){
    const server=SERVERS[card.s];
    const group=srvOk(server)?server.pool??'unassigned':'pending';
    if(!models.has(card.model)){
      models.set(card.model,{model:card.model,total:0,idle:0,unassigned:0,pending:0,byGroup:{},idleByGroup:{}});
    }
    const counts=models.get(card.model);
    counts.total++;
    if(card.st==='idle'){
      counts.idle++;
      counts.idleByGroup[group]=(counts.idleByGroup[group]??0)+1;
    }
    if(group==='unassigned'||group==='pending') counts[group]++;
    else counts.byGroup[group]=(counts.byGroup[group]??0)+1;
  }
  return [...models.values()].sort((a,b)=>b.total-a.total||a.model.localeCompare(b.model));
}
function stats(pool){
  const group=GROUPS.find(group=>group.id===pool);
  const servers=IDX.filter(si=>SERVERS[si].pool===pool&&SERVERS[si].roomId===group?.roomId&&srvOk(SERVERS[si]));
  const gpu=cards.filter(c=>servers.includes(c.s));
  return {servers:servers.length,total:gpu.length,
    busy:gpu.filter(c=>c.st==='busy').length,idle:gpu.filter(c=>c.st==='idle').length,
    bound:servers.reduce((sum,si)=>sum+srvBound(si),0),models:gpuModels(gpu)};
}

}

}

function renderRoomGpus(models, expanded, roomId){
  if(models.length===0) return '—';
  const modelRow=counts=>{
    const poolRow=(key,label,total,color)=>`<div class="pool-gpu-row" data-pool="${esc(key)}" data-total="${total}" data-idle="${counts.idleByGroup[key]??0}"><span class="tag ${color}" title="${esc(label)}">${esc(label)}</span><span class="pool-gpu-total num">总量 ${total} 张</span><span class="pool-gpu-idle num">空闲 ${counts.idleByGroup[key]??0} 张</span></div>`;
    const tags=GROUPS.filter(group=>group.roomId===roomId&&(counts.byGroup[group.id]??0)>0).map(group=>poolRow(group.id,group.name,counts.byGroup[group.id],groupColor(group.id))).join('');
    const unassigned=counts.unassigned?poolRow('unassigned','未分组',counts.unassigned,'gray'):'';
    const pending=counts.pending?poolRow('pending','分组待确认',counts.pending,'gray'):'';
    return `<div class="gpu-model">
      <div class="gpu-model-name"><strong>${esc(counts.model)}</strong><span class="num">${counts.total} 张</span></div>
      <div class="num" style="font-size:12px;color:var(--ok);margin-top:3px">空闲 GPU：${counts.idle} 张</div>
      <div class="pools-sum">${tags}${unassigned}${pending}</div>
    </div>`;
  };
  const visible=models.slice(0,3).map(modelRow).join('');
  if(models.length<=3) return visible;
  return `${visible}<details id="roomGpuDetails-${roomId}"${expanded?' open':''}>
    <summary><span class="gpu-expand">查看全部 ${models.length} 种型号</span><span class="gpu-collapse">收起</span></summary>
    ${models.slice(3).map(modelRow).join('')}
  </details>`;
}

function availableBilling(roomId){
  if(!ROOMS.some(room=>room.id===roomId)) return [];
  return Object.keys(BILLING).filter(key=>!GROUPS.some(group=>group.roomId===roomId&&group.billing.includes(key)));
}

  const roomId=$('newGroupRoom').value,available=availableBilling(roomId);
  $('billingChoices').innerHTML=available.map(key=>`<label><input type="checkbox" name="billing" value="${key}">${BILLING[key]}</label>`).join('');
  $('billingAvailability').hidden=available.length>0;
  $('billingAvailability').textContent=roomId?'当前机房的付费方式已全部关联分组，无法再创建分组。':'请先选择所属机房。';

function validateGroupName(name){
  if(!name) return '请输入分组名称。';
  if([...name].length<2||[...name].length>128) return '分组名称须为 2–128 个字符。';
  if(!/^[\p{Script=Han}A-Za-z0-9-]+$/u.test(name)) return '分组名称仅支持中文、英文字母、数字和连字符（-）。';
  if(!/^[\p{Script=Han}A-Za-z]/u.test(name)) return '分组名称须以中文或英文字母开头。';
  if(name.endsWith('-')) return '分组名称不能以连字符结尾。';
  return '';
}
$('createForm').addEventListener('input',()=>{$('createError').hidden=true;$('newGroupName').setAttribute('aria-invalid','false');});
$('createForm').onsubmit=e=>{
  e.preventDefault();
  const roomId=$('newGroupRoom').value;
  const roomValid=ROOMS.some(room=>room.id===roomId);
  const name=$('newGroupName').value.trim();
  const billing=[...$('createForm').querySelectorAll('input[name="billing"]:checked')].map(input=>input.value);
  const nameError=validateGroupName(name);
  const duplicate=GROUPS.some(group=>group.roomId===roomId&&group.name.toLowerCase()===name.toLowerCase());
  const conflict=billing.find(key=>!availableBilling(roomId).includes(key));
  const error=!roomValid?'请先选择所属机房。':!availableBilling(roomId).length?'当前机房的付费方式已全部关联分组，无法再创建分组。':nameError||(duplicate?'当前机房内分组名称已存在，请使用其他名称。':conflict?'所选付费方式已被其他分组关联，请重新选择。':!billing.length?'请至少选择一种付费方式。':'');
  if(conflict) renderBillingChoices();
  $('createError').textContent=error;
  $('createError').hidden=!error;
  $('newGroupName').setAttribute('aria-invalid',String(!!nameError||duplicate));
  if(error){(!roomValid?$('newGroupRoom'):nameError||duplicate?$('newGroupName'):$('createForm').querySelector('input[name="billing"]')??$('newGroupRoom')).focus();return;}
  const group={id:'rg-'+crypto.randomUUID(),name,roomId,billing};
  GROUPS.push(group);
  registerGroup(group);
  GROUP_LABEL[group.id]='onelink.ai/gpu-pool='+group.id;
  $('createDialog').close();
  go('group-'+group.id);
  toast('资源分组已创建。');
};
let nodeGroupId=null, nodeSelected=new Set();
const canAddNode=(si,groupId=nodeGroupId)=>!!GROUPS.find(group=>group.id===groupId&&group.roomId===SERVERS[si].roomId)&&!SERVERS[si].pool&&srvOk(SERVERS[si]);
function openNodes(groupId){
  if(!GROUPS.some(group=>group.id===groupId)) return;
  nodeGroupId=groupId;
  nodeSelected=new Set();
  $('nodeSearch').value='';
  const group=GROUPS.find(group=>group.id===groupId);
  $('nodeGroupName').textContent=`${roomName(group.roomId)} · ${group.name}`;
  $('nodesError').hidden=true;
  renderNodeCandidates();
  $('nodesDialog').showModal();
  $('nodeSearch').focus();
}
function updateNodeSelection(){
  $('nodeSelectedCount').textContent=`已选择 ${nodeSelected.size} 台`;
  $('nodesOk').disabled=nodeSelected.size===0;
  const visible=[...$('nodeCandidates').querySelectorAll('[data-node]')];
  const checked=visible.filter(input=>input.checked).length;
  $('allNodes').checked=visible.length>0&&checked===visible.length;
  $('allNodes').indeterminate=checked>0&&checked<visible.length;
}
function renderNodeCandidates(){
  const query=$('nodeSearch').value.trim().toLowerCase();
  const candidates=IDX.filter(si=>canAddNode(si)&&[SERVERS[si].name,SERVERS[si].id].some(value=>value.toLowerCase().includes(query)));
  $('nodeCount').textContent=`${candidates.length} 台可添加`;
  $('nodeCandidates').innerHTML=`<table><thead><tr><th><input type="checkbox" id="allNodes" aria-label="全选当前搜索结果" ${!candidates.length?'disabled':''}></th><th>服务器名称 / ID</th><th>所属机房</th><th>GPU 总量</th><th>绑定实例</th><th>当前 GPU 占用</th></tr></thead>
    <tbody>${candidates.map(si=>{const s=SERVERS[si];return `<tr class="node-choice-row"><td><input type="checkbox" data-node="${si}" aria-label="选择 ${s.name}" ${nodeSelected.has(si)?'checked':''}></td><td class="srvinfo"><b>${s.name}</b><div class="mono">${s.id}</div></td><td>${esc(roomName(s.roomId))}</td><td>${gpuModels(srvCards(si)).map(model=>`<div>${esc(model.model)} · ${model.total} 张</div>`).join('')}</td><td>${srvBound(si)}</td><td>${srvCards(si).filter(card=>card.st==='busy').length} 张</td></tr>`;}).join('')||'<tr><td colspan="6" class="muted" style="text-align:center;padding:36px">暂无符合条件的服务器</td></tr>'}</tbody></table>`;
  $('nodeCandidates').querySelectorAll('[data-node]').forEach(input=>input.onchange=()=>{
    if(input.checked) nodeSelected.add(+input.dataset.node);else nodeSelected.delete(+input.dataset.node);
    updateNodeSelection();
  });
  $('allNodes').onchange=e=>{
    candidates.forEach(si=>e.target.checked?nodeSelected.add(si):nodeSelected.delete(si));
    renderNodeCandidates();
  };
  updateNodeSelection();
}
$('nodeSearch').oninput=renderNodeCandidates;
$('nodeSearch').onkeydown=e=>{if(e.key==='Enter')e.preventDefault();};
$('nodesForm').onsubmit=async e=>{
  e.preventDefault();
  if(!nodeSelected.size) return;
  const selected=[...nodeSelected];
  const invalid=selected.filter(si=>!canAddNode(si));
  if(invalid.length){
    invalid.forEach(si=>nodeSelected.delete(si));
    renderNodeCandidates();
    $('nodesError').textContent=`${invalid.map(si=>SERVERS[si].name).join('、')} 的状态已变化，本次未添加任何节点，请重新确认。`;
    $('nodesError').hidden=false;
    return;
  }
  const groupId=nodeGroupId;
  $('nodesDialog').close();
  const results=await Promise.all(selected.map(si=>startSync(si,groupId,{quiet:true,unassignedOnly:true})));
  const succeeded=results.filter(Boolean).length;
  toast(succeeded===selected.length?`已添加 ${succeeded} 台服务器。`:`已添加 ${succeeded} 台，${selected.length-succeeded} 台未成功，请在节点列表查看。`);
};

/* ---------- 服务器管理 ---------- */
let poolFilter='all', searchServer='',serverRoomFilter='all';
function renderServers(){
  const list=[...IDX].reverse().filter(si=>{ const s=SERVERS[si];
    const matchesGroup=poolFilter==='all'||(s.pool??'unassigned')===poolFilter;
    return matchesGroup && (serverRoomFilter==='all'||s.roomId===serverRoomFilter) && [s.name,s.id].some(value=>value.toLowerCase().includes(searchServer.toLowerCase())); });
  $('main').innerHTML=`
    <div class="crumb"><span>云电脑管理</span>/<b>服务器管理</b></div>
    <section class="panel">
      <div class="filters server-filters">
        <div><label for="fServer">搜索</label><input id="fServer" class="fake" type="search" value="${esc(searchServer)}" placeholder="搜索服务器名称、ID"></div>
        <div><label for="fServerRoom">机房</label><select id="fServerRoom">${roomOptions()}</select></div>
        <div><label>类型</label><div class="fake">全部</div></div>
        <div><label>通信状态</label><div class="fake">全部</div></div>
        <div><label>设备状态</label><div class="fake">全部</div></div>
        <div><label for="fPool">资源分组</label>
          <select id="fPool"><option value="all">全部</option>${GROUPS.filter(group=>serverRoomFilter==='all'||group.roomId===serverRoomFilter).map(group=>`<option value="${group.id}">${esc(group.name)}${serverRoomFilter==='all'?' · '+esc(roomName(group.roomId)):''}</option>`).join('')}<option value="unassigned">未分组</option></select></div>
      </div>
      <div class="frow"><button class="btn primary" id="fSearch">查询</button><button class="btn" id="fReset">重置</button></div>
      <div class="tbl-wrap" style="margin-top:16px"><table>
        <tr><th>服务器信息</th><th>硬件配置</th><th>资源使用率</th><th>在线云电脑</th><th>绑定实例</th><th>通信状态</th><th>设备状态</th><th>资源分组</th><th>操作</th></tr>
        ${list.map(si=>{ const s=SERVERS[si];
          return `<tr><td class="srvinfo" style="min-width:184px"><b>${s.name}</b><div class="mono">ID: ${s.id}</div><div>IP: ${s.ip}</div><div>${esc(roomName(s.roomId))}</div><div>计算服务器</div></td>
          <td class="hw">CPU: 128核 | Intel(R) Xeon (R) Gold 6430 * 2<br>内存: ${s.mem}<br>磁盘: 0.43T${gpuModels(srvCards(si)).map(({model,total})=>`<br>GPU: ${total} 张 | ${esc(model)}`).join('')}</td>
          <td class="use num"><div class="r"><span>CPU</span><span>${s.cpu}%</span></div><div class="b"><i style="width:${Math.max(1,s.cpu)}%"></i></div>
            <div class="r"><span>内存</span><span>${s.memU}%</span></div><div class="b"><i class="hi" style="width:${s.memU}%"></i></div></td>
          <td class="num" style="text-align:center">${srvRun(si)}</td><td class="num" style="text-align:center">${srvBound(si)}</td><td><span class="tag ok">在线</span></td><td><span class="tag ok">启用</span></td>
          <td class="resource-group-cell">${serverGroupCell(si)}</td>
          <td><div class="server-ops"><button class="link" data-srv="${si}">详情</button>${groupActions(si)}<button class="link danger">禁用</button></div></td></tr>`;}).join('')
          || `<tr><td colspan="9" class="muted" style="text-align:center;padding:28px">没有符合条件的服务器</td></tr>`}
      </table></div>
      <div class="frow" style="justify-content:flex-end;font-size:13px;color:var(--fg-2)">共 ${list.length} 条</div>
    </section>`;
  $('fPool').value=poolFilter;
  $('fServerRoom').value=serverRoomFilter;
  $('fServerRoom').onchange=()=>{serverRoomFilter=$('fServerRoom').value;poolFilter='all';searchServer=$('fServer').value.trim();renderServers();};
  $('fSearch').onclick=()=>{ poolFilter=$('fPool').value; searchServer=$('fServer').value.trim(); renderServers(); };
  $('fServer').onkeydown=e=>{ if(e.key==='Enter') $('fSearch').click(); };
  $('fReset').onclick=()=>{ poolFilter='all'; searchServer='';serverRoomFilter='all'; renderServers(); };
  document.querySelectorAll('[data-srv]').forEach(b=>b.onclick=()=>openSrv(+b.dataset.srv));
}
let srvCur=0, srvTab='base';
function openSrv(si){ srvCur=si; srvTab='base'; renderSrv(); openMask('srvMask'); }
function renderSrv(){
  const s=SERVERS[srvCur];
  const T=[['base','基础信息'],['mon','实时监控'],['online',`在线云电脑(${srvRun(srvCur)})`],['gpu','GPU 明细(8)']];
  $('srvTabs').innerHTML=T.map(([k,n])=>`<button role="tab" aria-selected="${srvTab===k}" data-t="${k}">${n}</button>`).join('');
  $('srvTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ srvTab=b.dataset.t; renderSrv(); });
  let h='';
  if(srvTab==='base') h=`<div class="kv"><div><span>服务器名称</span><span>${s.name}</span></div><div><span>服务器 ID</span><span class="mono">${s.id}</span></div>
    <div><span>内网IP</span><span>${s.ip}</span></div><div><span>所属机房</span><span>${esc(roomName(s.roomId))}</span></div><div><span>服务器类型</span><span>计算服务器</span></div>
    <div><span>状态</span><span class="tag ok">在线</span></div><div><span>操作系统</span><span>ubuntu 22.04.5 LTS</span></div><div><span>虚拟化平台</span><span>hypervisor</span></div></div>
    <div class="server-group">
      <div class="ph"><h2>资源分组</h2></div>
      <div class="kv"><div><span>当前分组</span>${srvTags(srvCur)}</div>
      <div><span>适用购买方式</span><span>${esc(POOL_FOR[s.pool]??'—')}</span></div>
      <div><span>最近生效的标签</span><code class="lbl">${GROUP_LABEL[s.pool]??'—'}</code></div>
      <div><span>绑定实例</span><span>${srvBound(srvCur)}</span></div>
      <div><span>分组状态</span><span>${srvOk(s)?(s.pool?STATE.active:'待设置'):`${STATE[s.state]} · 目标为${esc(POOL[s.target])}`}</span></div></div>
    </div>`;
  else if(srvTab==='gpu') h=`<div class="tbl-wrap">${gpuTable(srvCur)}</div>`;
  else h=`<p class="hint">现有内容，原型略。</p>`;
  $('srvTitle').innerHTML=`服务器详情 <span>${s.name}</span>`;
  $('srvBody').innerHTML=h;

}

/* ---------- 整台服务器换组 ---------- */
let selectedServer=null;
function openAdj(si){
  const s=SERVERS[si];
  if(s.state==='syncing') return;
  selectedServer=si;
  $('adjTitle').textContent=`设置分组 · ${s.name}`;
  $('groupCurrent').textContent=`${roomName(s.roomId)} · 最近生效的分组：${POOL[s.pool]??'未分组'}`;
  $('groupTarget').innerHTML='<option value="" disabled>请选择分组</option>'+GROUPS.filter(group=>group.roomId===s.roomId).map(group=>`<option value="${group.id}">${esc(group.name)}</option>`).join('');
  $('groupTarget').value=s.target??s.pool??'';
  updateGroupForm();
  $('adjDialog').showModal();
}
function updateGroupForm(){
  const si=selectedServer, s=SERVERS[si], target=$('groupTarget').value;
  const failed=s.state==='failed';
  const validGroup=GROUPS.some(group=>group.id===target&&group.roomId===s.roomId);
  const changed=validGroup&&target!==s.pool;
  const capacityNote=changed&&s.pool==='course'?'请在保存前人工确认剩余课表容量。':'';
  $('groupTarget').disabled=failed;
  $('groupPurchase').textContent=POOL_FOR[target]??'—';
  const status=$('groupStatus');
  const bound=srvBound(si),busy=srvCards(si).filter(card=>card.st==='busy').length;
  status.hidden=!changed&&!failed;
  status.dataset.tone=failed?'error':bound?'warn':'info';
  const effect='仅影响后续新建 VM；存量实例保留原绑定与运行状态，之后仍在原服务器开机。';
  const stock=bound?`当前绑定 ${bound} 个实例、占用 ${busy} 张 GPU。分组生效不代表整机教学容量已预留，请人工确认。`:'';
  status.textContent=capacityNote+(failed?'上次同步未确认，保存后重新同步目标分组。':'')+effect+stock;
  $('adjOk').disabled=!changed||s.state==='syncing';
}
$('groupTarget').onchange=updateGroupForm;
$('adjClose').onclick=()=>$('adjDialog').close();
$('adjDialog').addEventListener('close',render);
$('adjForm').onsubmit=e=>{
  e.preventDefault();
  updateGroupForm();
  if($('adjOk').disabled) return;

  const target=$('groupTarget').value;
  $('adjDialog').close();
  startSync(selectedServer,target);
};
// 仅为原型异步演示；实际 Cloud Pod 接口及并发保护能力须由研发验证。
async function replaceServerLabel(si,target){
  await new Promise(resolve=>setTimeout(resolve,900));
}
async function startSync(si,target,{quiet=false,unassignedOnly=false}={}){
  const s=SERVERS[si];
  // 仅变更新建 VM 的调度归属；不得修改存量 VM、GPU 占用或原服务器绑定。
  if(s.state==='syncing'||!GROUPS.some(group=>group.id===target&&group.roomId===s.roomId)||target===s.pool||(unassignedOnly&&s.pool)) return false;
  s.target=target;
  s.state='syncing';
  render();
  try{
    await replaceServerLabel(si,target);
    s.pool=target;
    s.target=null;
    s.state='active';
    if(!quiet) toast('资源分组已更新。');
  }catch{
    s.state='failed';
    if(!quiet) toast('调度标签同步失败，请通过「设置分组」重新保存。');
  }
  render();
  return s.state==='active'&&s.pool===target;
}
function completeUnload(card){
  card.st='idle';
  card.inst='';
  render();
}
cards.filter(card=>card.st==='unload').forEach(card=>{
  setTimeout(()=>completeUnload(card),15000);
});

let tt;
function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.hidden=false;
  clearTimeout(tt);
  tt=setTimeout(()=>el.hidden=true,3000);
}

/* ---------- 渲染 ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  renderNav();
  if($('adjDialog').open){ updateGroupForm(); return; }
  if(view==='rooms') renderRooms();
  else if(view==='groups') currentGroupId?renderGroupDetail():renderGroups();
  else renderServers();
  if(!$('srvMask').hidden) renderSrv();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function route(){
  const [hash,search='']=location.hash.slice(1).split('?');
  const params=new URLSearchParams(search);
  if(hash==='groups'&&params.has('room')&&!ROOMS.some(room=>room.id===params.get('room'))){go('rooms');toast('机房不存在，请重新选择。');return;}
  currentGroupId=hash.startsWith('group-')?hash.slice(6):null;
  const scopedRoom=currentGroupId?GROUPS.find(group=>group.id===currentGroupId)?.roomId:params.get('room');
  groupRoomFilter=ROOMS.some(room=>room.id===scopedRoom)?scopedRoom:'all';
  view=hash==='rooms'?'rooms':hash==='groups'||currentGroupId?'groups':'servers';
  if(!['rooms','servers','groups'].includes(hash)&&!currentGroupId) history.replaceState(null,'','#'+view);
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
